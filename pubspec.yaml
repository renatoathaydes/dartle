name: dartle
description: >
  A simple build system written in Dart. Tasks can be declared in a regular Dart file,
  or Dart applications can use this package to create their own build systems.
version: 1.1.0
homepage: https://github.com/renatoathaydes/dartle

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  args: ^2.7.0
  meta: ^1.19.0
  io: ^1.1.0
  logging: ^1.3.0
  crypto: ^3.0.8
  path: ^1.9.1
  collection: ^1.19.1
  actors: ^0.11.0
  structured_async: ^0.3.2
  clock: ^1.1.3
  test_report_parser: ^1.3.0
  convert: ^3.1.2
  yaml: ^3.1.4
  tar: ^2.0.3
  isolate_current_directory: ^2.2.1

dev_dependencies:
  test: ^1.33.0
  lints: ^6.1.0

executables:
  dartle:
